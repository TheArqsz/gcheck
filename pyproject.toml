[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gcheck"
version = "0.2.0"
description = "Validate exposed Google and Firebase credentials and determine real access scope."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
service-account = [
    "cryptography>=41,<50",
]
maps-js = [
    "playwright>=1.50,<2",
]
all = [
    "cryptography>=41,<50",
    "playwright>=1.50,<2",
]

[project.scripts]
gcheck = "gcheck:main"

[project.urls]
Repository = "https://github.com/TheArqsz/gcheck"

[tool.setuptools]
py-modules = ["gcheck"]

[tool.setuptools.packages.find]
include = ["checks*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
allow_zero_version = true
